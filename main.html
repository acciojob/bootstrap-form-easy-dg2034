
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internship Form</title>

    <link rel="stylesheet"
    href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

    <link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="container mt-5">

    <form id="internship-form" novalidate>

        <h2 class="text-center mb-5">Internship Form</h2>

        <div class="form-row">

            <!-- First Name -->
            <div class="form-group col-md-4">
                <label for="first-name-input">First Name</label>
                <input type="text" class="form-control"
                       id="first-name-input" required>
                <div class="invalid-feedback">
                    First name required!
                </div>
            </div>

            <!-- Last Name -->
            <div class="form-group col-md-4">
                <label for="last-name-input">Last Name</label>
                <input type="text" class="form-control"
                       id="last-name-input" required>
                <div class="invalid-feedback">
                    Last name required!
                </div>
            </div>

            <!-- Email -->
            <div class="form-group col-md-4">
                <label for="email-input">Email Address</label>
                <input type="email" class="form-control"
                       id="email-input" placeholder="xyz@abc.com" required>
                <div class="invalid-feedback">
                    Email required!
                </div>
            </div>

        </div>

        <div class="form-row">

            <!-- College -->
            <div class="form-group col-md-6">
                <label for="college-input">College</label>
                <input type="text" class="form-control"
                       id="college-input" required>
                <div class="invalid-feedback">
                    Please provide a valid college.
                </div>
            </div>

            <!-- Graduation Year -->
            <div class="form-group col-md-3">
                <label for="graduation-year-input">Graduation Year</label>
                <select class="form-control"
                        id="graduation-year-input" required>
                    <option value="">Choose...</option>
                    <option value="2020">2020</option>
                    <option value="2021">2021</option>
                    <option value="2022">2022</option>
                    <option value="2023">2023</option>
                </select>
                <div class="invalid-feedback">
                    Please select a valid Graduation Year.
                </div>
            </div>

            <!-- Roll Number -->
            <div class="form-group col-md-3">
                <label for="roll-no-input">Roll No.</label>
                <input type="number" class="form-control"
                       id="roll-no-input" required>
                <div class="invalid-feedback">
                    Please provide a valid Roll no.
                </div>
            </div>

        </div>

        <!-- Terms and Conditions -->
        <div class="form-group">
            <div class="form-check">
                <input type="checkbox" class="form-check-input"
                       id="conditions-checkbox" required>

                <label class="form-check-label"
                       for="conditions-checkbox">
                    Agree to terms and conditions
                </label>

                <div class="invalid-feedback">
                    You must agree before submitting.
                </div>
            </div>
        </div>

        <button type="submit" class="btn btn-primary">
            Submit form
        </button>

    </form>

</div>

<script>
    const form = document.getElementById("internship-form");

    form.addEventListener("submit", function(event) {
        event.preventDefault();

        form.classList.add("was-validated");

        if (form.checkValidity()) {
            alert("Form submitted successfully!");
        }
    });
</script>

</body>
</html>
